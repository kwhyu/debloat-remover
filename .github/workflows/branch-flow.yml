# Allows pull requests into main only from the snapshot branch of this repository.
name: Branch flow

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  source-branch:
    name: Source branch check
    runs-on: ubuntu-latest
    steps:
      - name: Require snapshot as the source
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "snapshot" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Pull requests into main must come from the snapshot branch of this repository."
            exit 1
          fi
